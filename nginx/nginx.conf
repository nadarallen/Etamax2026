events {
    worker_connections 20480;
}

worker_rlimit_nofile 65535;


http {
    include       mime.types;
    default_type  application/octet-stream;

    # Proxy Cache Configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nextjs_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Connection header for WebSocket and Keep-Alive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # Timeouts

    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;

    # Buffers
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;


    upstream nextjs_upstream {
        server app:3000;
        keepalive 512;
    }



    server {
        listen 80;

        # Gzip Compression
        gzip on;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_types text/css application/javascript image/svg+xml;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;


        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # API Rate Limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://nextjs_upstream;
        }

        # Static Asset Caching with Proxy Cache
        location /_next/static {
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=3600, immutable";
            proxy_pass http://nextjs_upstream;
        }

        location /static {
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=3600, immutable";
            proxy_pass http://nextjs_upstream;
        }

        # General traffic with rate limiting
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://nextjs_upstream;
        }
    }
}

