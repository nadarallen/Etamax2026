events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream nextjs_upstream {
        server app:3000;
        # Docker Compose will use DNS round-robin to existing replicas
        # Alternatively, list explicitly if using static IPs, but with Docker Swarm/Compose replicas,
        # 'app' resolves to multiple IPs and Nginx handles it (if configured correctly) or Docker internal LB does.
        # For simple compose replications, 'app' resolves to a VIP or round-robin DNS.
    }

    server {
        listen 80;

        # Gzip Compression
        gzip on;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_types text/css application/javascript image/svg+xml;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Static Asset Caching (Critical for Thundering Herd)
        location /_next/static {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 60m;
            add_header Cache-Control "public, max-age=3600, immutable";
        }

        location /static {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 60m;
            add_header Cache-Control "public, max-age=3600, immutable";
        }

        location / {
            proxy_pass http://nextjs_upstream;
        }
    }
}
