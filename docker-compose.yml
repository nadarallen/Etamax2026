services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - etamax-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    deploy:
      replicas: 10
    environment:
      - MONGODB_URI=mongodb://mongo:27017/etamax2026
      - MONGODB_MAX_POOL_SIZE=10
      - NEXT_PUBLIC_APP_URL=http://localhost
      - NEXTAUTH_URL=http://localhost
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - UPSTASH_REDIS_REST_URL=http://redis-http:80
      - UPSTASH_REDIS_REST_TOKEN=${REDIS_HTTP_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      # Payment and Email keys passed through
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - mongo
      - redis
    networks:
      - etamax-network

  mongo:
    container_name: etamax-mongo
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - etamax-network

  redis:
    container_name: etamax-redis
    image: redis:alpine
    restart: always
    expose:
      - 6379
    networks:
      - etamax-network

  redis-http:
    container_name: etamax-redis-http
    image: hiett/serverless-redis-http:latest
    restart: always
    ports:
      - "8079:80"
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=${REDIS_HTTP_TOKEN}
      - SRH_CONNECTION_STRING=redis://redis:6379
    depends_on:
      - redis
    networks:
      - etamax-network

networks:
  etamax-network:
    driver: bridge

volumes:
  mongo-data:
