services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - etamax-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    restart: always

    deploy:
      replicas: 8
    environment:

      - MONGODB_URI=mongodb://mongo:27017/etamax2026
      - MONGODB_MAX_POOL_SIZE=100

      - NEXT_PUBLIC_APP_URL=http://localhost
      - NEXTAUTH_URL=http://localhost
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - UPSTASH_REDIS_REST_URL=http://redis-http:80
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      # Payment and Email keys passed through
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - etamax-network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  mongo:
    container_name: etamax-mongo
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: [ "mongod", "--wiredTigerCacheSizeGB", "2.0" ]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - etamax-network

  redis:
    container_name: etamax-redis
    image: redis:alpine
    restart: always
    expose:
      - 6379
    networks:
      - etamax-network

  redis-http:
    container_name: etamax-redis-http
    image: hiett/serverless-redis-http:latest
    restart: always
    ports:
      - "8079:80"
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - SRH_CONNECTION_STRING=redis://redis:6379
    depends_on:
      - redis
    networks:
      - etamax-network

networks:
  etamax-network:
    driver: bridge

volumes:
  mongo-data:
